repository:
  - name: gitrieve
    url: github.com/wnarutou/gitrieve
    cron: "0 * * * *"
    storage:
      - localFile
      - backblaze
    useCache: True
    allBranches: True
    depth: 0
    downloadReleases: True
    downloadIssues: True
    downloadWiki: True
    downloadDiscussion: True
  - name: docmost
    url: github.com/docmost/docmost
    cron: "0 * * * *"
    storage:
      - localFile
    useCache: True
    allBranches: True
    depth: 0
    downloadReleases: True
    downloadIssues: True
    downloadWiki: True
    downloadDiscussion: True
  - name: wn
    url: github.com/wnarutou/gitrieve
    cron: "0 * * * *"
    storage:
      - localFile
    useCache: True
    allBranches: True
    depth: 0
    downloadReleases: True
    downloadIssues: True
    downloadWiki: True
    downloadDiscussion: True

  - name: me
    orgName: wnarutou
    type: user
    storage:
      - localFile
    useCache: True
    allBranches: True
    depth: 0
    downloadReleases: True
    downloadIssues: True
    downloadWiki: True
    downloadDiscussion: True

storage:
  - name: localFile
    type: file
    path: ./repo
  - name: backblaze
    type: s3
    endpoint: s3.us-west-000.backblazeb2.com
    region: us-west-000
    bucket: your-bucket-name
    accessKeyID: your-access-key-id
    secretAccessKey: your-secret-access-key

githubToken: xxx
# Optional pool: use tokens belonging to two different GitHub users. A nonempty
# pool takes precedence over githubToken. Leave it empty to use the legacy token.
# GitHub HTTPS clone/fetch/pull also use this pool, rotating on 401/403/404.
# Private code repositories need tokens with code-read permission.
githubAccounts:
  - name: alice
    token: alice-personal-access-token
  - name: bob
    token: bob-personal-access-token
githubApiConcurrency: 4
githubAccountConcurrency: 2
githubMinRequestInterval: 200ms
githubLowRemainingThreshold: 100
githubScheduleJitter: 30s
syncOverdueGrace: 30m
syncStuckThreshold: 24h
cocurrencyNum: 12
releaseSizeLimit: 300000000
releaseNumLimit: 3

# Web server (UI + API) settings. Only used by the `server` subcommand.
server:
  host: 0.0.0.0
  port: "8080"
  # Path to the SQLite database. This file also stores job history and logs.
  # In Docker, set this to a path under a mounted volume (e.g. /app/data) so
  # the data persists across container rebuilds and can be backed up from the
  # host. The default is gitrieve.db (relative to the working directory).
  dbPath: /app/data/gitrieve.db
  # Optional bearer-token auth for the API. Leave authEnabled false to disable.
  authEnabled: false
  authToken: ""
