services:
  gitrieve:
    # Built from the repo Dockerfile. To build locally run: make docker-build
    # Or pull the released image: wnarutou/gitrieve:latest
    image: wnarutou/gitrieve:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gitrieve
    restart: unless-stopped
    # Enter maintenance and wait for ready before upgrading. This is the
    # fallback grace for SIGTERM while a page/file/archive is still finishing.
    stop_grace_period: 10m
    environment:
      # set the timezone to be used by cron schedule
      # see https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      - TZ=Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      # config file — modify the left side to point at your config.yaml
      - ./config/example.config.yaml:/root/config.yaml
      # archive output directory — the in-container path must match the
      # `path:` configured under storage in config.yaml (e.g. /app/repo)
      - ./repo:/app/repo
      # persistent directory for the SQLite database (gitrieve.db), which also
      # stores job history and logs. Bind-mounted to a local directory so the
      # data is directly visible on the host for easy backup and migration
      # (e.g. `tar -czf backup.tar.gz ./data`). The in-container path must
      # match `server.dbPath` in config.yaml.
      - ./data:/app/data
      # git clone cache directory — persists the local .git object store and
      # working copy across container rebuilds (required when useCache: true).
      # The in-container path resolves under the working directory /app.
      - ./.gitrieve:/app/.gitrieve
    # Run the server, reading config from the mounted path.
    # The web assets (templates/static) are baked into the image under /app/web.
    command: ["-c", "/root/config.yaml", "server"]
    # Alternative commands:
    #   archive all repositories defined in configuration:
    #   command: ["-c", "/root/config.yaml", "run"]
    #   run cron schedules without the Web UI/API:
    #   command: ["-c", "/root/config.yaml", "daemon"]
