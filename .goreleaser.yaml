version: 2
project_name: gitrieve
before:
  hooks:
    - go mod tidy
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    ldflags: -s -w -X github.com/wnarutou/gitrieve/internal/buildinfo.Version={{ .Version }}
    goarch:
      - amd64
      - arm64
archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
dockers:
  - image_templates:
      - wnarutou/gitrieve:{{ .Tag }}-amd64
    dockerfile: Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - --pull
      - --platform=linux/amd64
    goarch: amd64
  - image_templates:
      - wnarutou/gitrieve:{{ .Tag }}-arm64
    dockerfile: Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - --pull
      - --platform=linux/arm64
    goarch: arm64
docker_manifests:
  - name_template: wnarutou/gitrieve:{{ .Tag }}
    image_templates:
      - wnarutou/gitrieve:{{ .Tag }}-amd64
      - wnarutou/gitrieve:{{ .Tag }}-arm64
  - name_template: wnarutou/gitrieve:latest
    image_templates:
      - wnarutou/gitrieve:{{ .Tag }}-amd64
      - wnarutou/gitrieve:{{ .Tag }}-arm64
checksum:
  name_template: 'checksums.txt'
snapshot:
  name_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
